<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الألغاز 2D أونلاين</title>
    <!-- مكتبة PubNub للاتصال الفوري -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .menu-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 35px 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 440px; z-index: 10; }
        .menu-card h1 { font-size: 2.2rem; margin-bottom: 20px; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .id-box { background: rgba(15, 23, 42, 0.7); padding: 12px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 20px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .id-text { word-break: break-all; color: #4ade80; font-weight: bold; font-family: monospace; font-size: 1rem; }
        .btn-copy { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s ease; white-space: nowrap; }
        .btn-copy:hover { background: #38bdf8; color: #0f172a; }
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
        .btn-secondary { background: #334155; color: white; margin-top: 10px; }
        .btn-secondary:hover { background: #475569; }
        #canvas { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #hud { display: none; position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.8); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); z-index: 5; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            الغرفة الحالية: <span id="hud-status" style="color: #4ade80;">...</span>
        </div>

        <div class="menu-card" id="main-menu">
            <h1>ألغاز 2D أونلاين</h1>
            
            <div class="id-box">
                <div>كود الغرفة: <span class="id-text" id="my-id">...</span></div>
                <button class="btn-copy" id="copy-btn" onclick="copyMyID()">نسخ 📋</button>
            </div>

            <div class="input-group">
                <input type="text" id="peer-id-input" placeholder="أدخل كود غرفة صديقك">
                <button class="btn btn-primary" onclick="joinRoom()">انضمام للغرفة واللعب 🔗</button>
            </div>

            <button class="btn btn-secondary" onclick="startGame()">اللعب في غرفتك (مضيف) 🎮</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');
        const hudStatus = document.getElementById('hud-status');
        const myIdDisplay = document.getElementById('my-id');
        const copyBtn = document.getElementById('copy-btn');

        // إنشاء هوية مميزة لكل لاعب
        const myUserId = 'user_' + Math.floor(Math.random() * 100000);
        const myRoomCode = "ROOM-" + Math.floor(1000 + Math.random() * 9000);
        let currentChannel = myRoomCode;

        // خوادم الاتصال
        const pubnub = new PubNub({
            publishKey: 'demo',
            subscribeKey: 'demo',
            userId: myUserId
        });

        myIdDisplay.innerText = myRoomCode;

        // إحداثيات اللاعبين
        let myPlayer = { x: 200, y: 200, size: 30, speed: 6, color: '#38bdf8' }; // مربع أزرق (أنت)
        let otherPlayer = { x: -100, y: -100, size: 30, color: '#ef4444', active: false }; // مربع أحمر (صديقك)

        function subscribeToChannel(channelName) {
            currentChannel = channelName;
            hudStatus.innerText = currentChannel;
            
            pubnub.subscribe({ channels: [currentChannel] });

            pubnub.addListener({
                message: function(event) {
                    // إذا استلمت موقع لاعب آخر وليس موقعك أنت
                    if (event.publisher !== myUserId && event.message.type === 'move') {
                        otherPlayer.x = event.message.x;
                        otherPlayer.y = event.message.y;
                        otherPlayer.active = true;
                    }
                }
            });
        }

        // الاشتراك الافتراضي في الغرفة
        subscribeToChannel(myRoomCode);

        function copyMyID() {
            navigator.clipboard.writeText(myRoomCode).then(() => {
                copyBtn.innerText = "تم النسخ! ✅";
                copyBtn.style.background = "#22c55e";
                setTimeout(() => {
                    copyBtn.innerText = "نسخ 📋";
                    copyBtn.style.background = "#334155";
                }, 2000);
            });
        }

        // 1. الانضمام والدخول للعبة فوراً
        function joinRoom() {
            const targetRoom = document.getElementById('peer-id-input').value.trim();
            if (targetRoom) {
                pubnub.unsubscribeAll();
                subscribeToChannel(targetRoom);
                startGame(); // إدخال اللاعب للعبة مباشرة عند الضغط!
            } else {
                alert("يرجى إدخال كود الغرفة أولاً!");
            }
        }

        // 2. بدء الجيم وإخفاء القائمة
        function startGame() {
            mainMenu.style.display = 'none';
            hud.style.display = 'block';
            canvas.style.display = 'block';
            resizeCanvas();
            
            // تحديد موقع ابتدائي عشوائي حتى لا يتطابق اللاعبان بنفس المكان في البداية
            myPlayer.x = Math.random() * (canvas.width - 100) + 50;
            myPlayer.y = Math.random() * (canvas.height - 100) + 50;

            sendPosition();
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // 3. حركة WASD وإرسال الإحداثيات للاعب الثاني عبر الشبكة
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            let moved = false;
            if (keys['w'] || keys['arrowup']) { myPlayer.y -= myPlayer.speed; moved = true; }
            if (keys['s'] || keys['arrowdown']) { myPlayer.y += myPlayer.speed; moved = true; }
            if (keys['a'] || keys['arrowleft']) { myPlayer.x -= myPlayer.speed; moved = true; }
            if (keys['d'] || keys['arrowright']) { myPlayer.x += myPlayer.speed; moved = true; }

            // إرسال الإحداثيات فور تحركك
            if (moved) {
                sendPosition();
            }
        }

        function sendPosition() {
            pubnub.publish({
                channel: currentChannel,
                message: {
                    type: 'move',
                    x: myPlayer.x,
                    y: myPlayer.y
                }
            });
        }

        // 4. رسم اللاعبين معاً
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // شبكة الخلفية
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // رسم مربعك أنت (اللاعب 1: أزرق متوهج)
            ctx.fillStyle = myPlayer.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = myPlayer.color;
            ctx.fillRect(myPlayer.x - myPlayer.size/2, myPlayer.y - myPlayer.size/2, myPlayer.size, myPlayer.size);

            // رسم المربع الخاص بصديقك (اللاعب 2: أحمر متوهج)
            if (otherPlayer.active) {
                ctx.fillStyle = otherPlayer.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = otherPlayer.color;
                ctx.fillRect(otherPlayer.x - otherPlayer.size/2, otherPlayer.y - otherPlayer.size/2, otherPlayer.size, otherPlayer.size);
            }
            
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
