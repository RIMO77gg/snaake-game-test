<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب أونلاين 2D - Mini Games</title>
    <!-- مكتبة PeerJS للاتصال المباشر WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #090d16; color: #fff; display: flex; justify-content: center; align-items: center; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* القائمة الرئيسية */
        .menu-card { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center; width: 95%; max-width: 480px; z-index: 10; position: absolute; }
        .menu-card h1 { font-size: 2.2rem; margin-bottom: 15px; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .id-box { background: rgba(15, 23, 42, 0.7); padding: 12px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 15px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .id-text { color: #4ade80; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .btn-copy { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .btn-copy:hover { background: #38bdf8; color: #0f172a; }
        
        /* اختيار الألوان */
        .color-picker-title { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 10px; text-align: right; font-weight: bold; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 12px rgba(255,255,255,0.8); }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #334155; color: white; margin-top: 8px; }
        .btn-secondary:hover { background: #475569; }
        
        /* شاشة اللعبة الكانفاس بابعاد محددة مسبقا مع Scaled Auto */
        #canvas { display: none; background: #0f172a; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        
        /* HUD واجهة المعومات والحالة */
        #hud { display: none; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.85); padding: 10px 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); z-index: 5; font-size: 1rem; display: flex; gap: 20px; align-items: center; }
        .mode-selector { display: flex; gap: 8px; }
        .mode-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
        .mode-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div>اللاعبون: <span id="player-count" style="color: #4ade80;">1</span></div>
            <div>الميني جيم: <span id="current-game-title" style="color: #38bdf8;">الرئيسي (Lobby)</span></div>
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchGameMode('lobby')">اللوبي</button>
                <button class="mode-btn" onclick="switchGameMode('puzzle')">🧩 الألغاز</button>
                <button class="mode-btn" onclick="switchGameMode('dodge')">🤾‍♂️ التفادي</button>
                <button class="mode-btn" onclick="switchGameMode('horror')">👻 الرعب</button>
            </div>
        </div>

        <div class="menu-card" id="main-menu">
            <h1>Mini Games أونلاين 🎮</h1>
            
            <div class="id-box">
                <div>كود غرفتك: <span class="id-text" id="my-id">جاري الإنشاء...</span></div>
                <button class="btn-copy" id="copy-btn" onclick="copyMyID()">نسخ 📋</button>
            </div>

            <div class="color-picker-title">اختر لون لاعبك:</div>
            <div class="color-grid" id="color-grid"></div>

            <div class="input-group">
                <input type="text" id="peer-id-input" placeholder="أدخل كود غرفة صديقك">
                <button class="btn btn-primary" id="join-btn">انضمام للغرفة واللعب 🔗</button>
            </div>

            <button class="btn btn-secondary" onclick="startHosting()">استضافة واللعب في غرفتك 🎮</button>
        </div>

        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');
        const playerCountDisplay = document.getElementById('player-count');
        const currentGameTitle = document.getElementById('current-game-title');
        const myIdDisplay = document.getElementById('my-id');
        const copyBtn = document.getElementById('copy-btn');
        const joinBtn = document.getElementById('join-btn');

        // أبعاد الشاشة الافتراضية الثابتة للجميع
        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;

        const colors = [
            '#38bdf8', '#ef4444', '#22c55e', '#eab308', '#a855f7',
            '#ec4899', '#f97316', '#14b8a6', '#f43f5e', '#8b5cf6'
        ];
        
        let currentGameMode = 'lobby'; // (lobby, puzzle, dodge, horror)

        let myPlayer = { 
            id: null,
            x: 640, 
            y: 360, 
            size: 30, 
            speed: 6, 
            color: colors[0]
        };

        // إعداد الألوان
        const colorGrid = document.getElementById('color-grid');
        colors.forEach((col, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                myPlayer.color = col;
            };
            colorGrid.appendChild(btn);
        });

        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        let peer = null;
        let connections = {};
        let otherPlayers = {};

        // المتغيرات الخاصة بالميني جيمز
        let puzzleButton = { x: 300, y: 360, radius: 40, pressed: false };
        let puzzleDoor = { x: 900, y: 200, width: 30, height: 320, open: false };

        let fallingRocks = [];
        let horrorMonster = { x: 100, y: 100, size: 40, speed: 2.5 };

        function initPeer() {
            peer = new Peer('ROOM-' + roomCode);
            peer.on('open', (id) => {
                myPlayer.id = id;
                myIdDisplay.innerText = roomCode;
            });
            peer.on('connection', (conn) => setupConnection(conn));
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer();
                    peer.on('open', (id) => { myPlayer.id = id; myIdDisplay.innerText = id; });
                    peer.on('connection', (conn) => setupConnection(conn));
                }
            });
        }
        initPeer();

        function setupConnection(conn) {
            connections[conn.peer] = conn;
            conn.on('open', () => {
                updatePlayerCount();
                conn.send({ type: 'update', id: myPlayer.id, x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, mode: currentGameMode });
            });
            conn.on('data', (data) => {
                if (data.type === 'update') {
                    if (!otherPlayers[data.id]) {
                        otherPlayers[data.id] = { x: data.x, y: data.y, targetX: data.x, targetY: data.y, color: data.color, size: 30 };
                    } else {
                        otherPlayers[data.id].targetX = data.x;
                        otherPlayers[data.id].targetY = data.y;
                        otherPlayers[data.id].color = data.color;
                    }
                    if(data.mode && data.mode !== currentGameMode) {
                        setLocalMode(data.mode);
                    }
                    updatePlayerCount();
                }
            });
            conn.on('close', () => {
                delete connections[conn.peer];
                delete otherPlayers[conn.peer];
                updatePlayerCount();
            });
        }

        function updatePlayerCount() {
            playerCountDisplay.innerText = Object.keys(otherPlayers).length + 1;
        }

        function copyMyID() {
            navigator.clipboard.writeText(myIdDisplay.innerText).then(() => {
                copyBtn.innerText = "تم النسخ! ✅";
                copyBtn.style.background = "#22c55e";
                setTimeout(() => { copyBtn.innerText = "نسخ 📋"; copyBtn.style.background = "#334155"; }, 2000);
            });
        }

        function startHosting() { startGame(); }

        joinBtn.addEventListener('click', function() {
            const inputField = document.getElementById('peer-id-input');
            let targetRoom = inputField.value.trim();
            if (targetRoom !== "") {
                if(!targetRoom.startsWith('ROOM-') && targetRoom.length === 4) targetRoom = 'ROOM-' + targetRoom;
                const conn = peer.connect(targetRoom);
                setupConnection(conn);
                startGame();
            } else { alert("يرجى إدخال كود الغرفة أولاً!"); }
        });

        function switchGameMode(mode) {
            setLocalMode(mode);
            broadcastPosition();
        }

        function setLocalMode(mode) {
            currentGameMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            
            const titles = {
                'lobby': 'اللوبي الرئيسي',
                'puzzle': '🧩 ميني جيم الألغاز والزر التعاوني',
                'dodge': '🤾‍♂️ ميني جيم تفادي الصخور',
                'horror': '👻 ميني جيم المتاهة المظلمة (رعب)'
            };
            currentGameTitle.innerText = titles[mode];
            
            // إعادة ضبط المواقع عند التبديل
            myPlayer.x = 200; myPlayer.y = 360;
            if(mode === 'dodge') fallingRocks = [];
        }

        function startGame() {
            mainMenu.style.display = 'none';
            hud.style.display = 'flex';
            canvas.style.display = 'block';
            resizeCanvas();

            setInterval(broadcastPosition, 30);
            setInterval(updateGameLogic, 1000 / 60);
            requestAnimationFrame(gameLoop);
        }

        // إبقاء الكانفاس بنفس الأبعاد الافتراضية مع الملاءمة والتكبير الذكي للتصغير والتكبير
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / VIRTUAL_WIDTH, window.innerHeight / VIRTUAL_HEIGHT);
            canvas.style.width = `${VIRTUAL_WIDTH * scale}px`;
            canvas.style.height = `${VIRTUAL_HEIGHT * scale}px`;
        }
        window.addEventListener('resize', resizeCanvas);

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function updateGameLogic() {
            // حركة اللاعب
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= myPlayer.speed;
            if (keys['s'] || keys['arrowdown']) dy += myPlayer.speed;
            if (keys['a'] || keys['arrowleft']) dx -= myPlayer.speed;
            if (keys['d'] || keys['arrowright']) dx += myPlayer.speed;

            let nextX = myPlayer.x + dx;
            let nextY = myPlayer.y + dy;

            // تصادم الجدران الشاشة
            if (nextX > 20 && nextX < VIRTUAL_WIDTH - 20) myPlayer.x = nextX;
            if (nextY > 20 && nextY < VIRTUAL_HEIGHT - 20) myPlayer.y = nextY;

            // تنعيم باقي اللاعبين
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                p.x += (p.targetX - p.x) * 0.4;
                p.y += (p.targetY - p.y) * 0.4;
            }

            // منطق الميني جيمز الخاص
            if (currentGameMode === 'puzzle') {
                // فحص الوقوف على الزر
                let distToBtn = Math.hypot(myPlayer.x - puzzleButton.x, myPlayer.y - puzzleButton.y);
                let otherOnBtn = false;
                for(let id in otherPlayers) {
                    if(Math.hypot(otherPlayers[id].x - puzzleButton.x, otherPlayers[id].y - puzzleButton.y) < puzzleButton.radius) otherOnBtn = true;
                }
                
                puzzleDoor.open = (distToBtn < puzzleButton.radius || otherOnBtn);

                // تصادم مع الباب المغلق
                if (!puzzleDoor.open) {
                    if (myPlayer.x + myPlayer.size/2 > puzzleDoor.x && myPlayer.x - myPlayer.size/2 < puzzleDoor.x + puzzleDoor.width &&
                        myPlayer.y + myPlayer.size/2 > puzzleDoor.y && myPlayer.y - myPlayer.size/2 < puzzleDoor.y + puzzleDoor.height) {
                        myPlayer.x -= dx; myPlayer.y -= dy;
                    }
                }
            } 
            else if (currentGameMode === 'dodge') {
                // توليد صخور
                if (Math.random() < 0.05) {
                    fallingRocks.push({ x: Math.random() * VIRTUAL_WIDTH, y: -20, radius: Math.random() * 20 + 15, speed: Math.random() * 4 + 3 });
                }
                for (let i = fallingRocks.length - 1; i >= 0; i--) {
                    let r = fallingRocks[i];
                    r.y += r.speed;
                    // فحص تصادم
                    if (Math.hypot(myPlayer.x - r.x, myPlayer.y - r.y) < r.radius + myPlayer.size/2) {
                        myPlayer.x = 100; myPlayer.y = 360; // إرجاع عند الخسارة
                    }
                    if (r.y > VIRTUAL_HEIGHT + 30) fallingRocks.splice(i, 1);
                }
            } 
            else if (currentGameMode === 'horror') {
                // تتبع الوحش لأقرب لاعب
                let target = myPlayer;
                let minDist = Math.hypot(myPlayer.x - horrorMonster.x, myPlayer.y - horrorMonster.y);
                
                for(let id in otherPlayers) {
                    let d = Math.hypot(otherPlayers[id].x - horrorMonster.x, otherPlayers[id].y - horrorMonster.y);
                    if(d < minDist) { minDist = d; target = otherPlayers[id]; }
                }

                let angle = Math.atan2(target.y - horrorMonster.y, target.x - horrorMonster.x);
                horrorMonster.x += Math.cos(angle) * horrorMonster.speed;
                horrorMonster.y += Math.sin(angle) * horrorMonster.speed;

                // إعادة الرسترت عند لمس الوحش
                if(Math.hypot(myPlayer.x - horrorMonster.x, myPlayer.y - horrorMonster.y) < horrorMonster.size/2 + myPlayer.size/2) {
                    myPlayer.x = 1100; myPlayer.y = 650;
                }
            }
        }

        function broadcastPosition() {
            const packet = {
                type: 'update',
                id: myPlayer.id,
                x: myPlayer.x,
                y: myPlayer.y,
                color: myPlayer.color,
                mode: currentGameMode
            };
            for (let peerId in connections) {
                if (connections[peerId].open) connections[peerId].send(packet);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            // شبكة الخلفية
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < VIRTUAL_WIDTH; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIRTUAL_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < VIRTUAL_HEIGHT; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIRTUAL_WIDTH, y); ctx.stroke();
            }

            // رسم الميني جيم المختار
            if (currentGameMode === 'puzzle') {
                // الزر
                ctx.fillStyle = puzzleDoor.open ? '#22c55e' : '#ef4444';
                ctx.beginPath(); ctx.arc(puzzleButton.x, puzzleButton.y, puzzleButton.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = '16px Tahoma'; ctx.fillText('اضغط هنا لفتح الباب', puzzleButton.x - 65, puzzleButton.y - 50);

                // الباب
                ctx.fillStyle = puzzleDoor.open ? 'rgba(34, 197, 94, 0.2)' : '#eab308';
                ctx.fillRect(puzzleDoor.x, puzzleDoor.y, puzzleDoor.width, puzzleDoor.height);
            }
            else if (currentGameMode === 'dodge') {
                // رسم الصخور
                ctx.fillStyle = '#f97316';
                fallingRocks.forEach(r => {
                    ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.fill();
                });
            }
            else if (currentGameMode === 'horror') {
                // الوحش المخيف
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 20; ctx.shadowColor = '#ef4444';
                ctx.fillRect(horrorMonster.x - horrorMonster.size/2, horrorMonster.y - horrorMonster.size/2, horrorMonster.size, horrorMonster.size);
                ctx.shadowBlur = 0;
            }

            // رسم باقي اللاعبين
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12; ctx.shadowColor = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }

            // رسم لاعبك المحلي
            ctx.fillStyle = myPlayer.color;
            ctx.shadowBlur = 15; ctx.shadowColor = myPlayer.color;
            ctx.fillRect(myPlayer.x - myPlayer.size/2, myPlayer.y - myPlayer.size/2, myPlayer.size, myPlayer.size);
            ctx.shadowBlur = 0;

            // إضاءة كشاف ضوئي حول اللاعبين في ميني جيم الرعب (Lighting effect)
            if (currentGameMode === 'horror') {
                ctx.save();
                ctx.fillStyle = 'rgba(5, 5, 10, 0.94)';
                ctx.beginPath();
                ctx.rect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                
                // فتح دائرة كشاف حول اللاعب
                ctx.arc(myPlayer.x, myPlayer.y, 140, 0, Math.PI * 2, true);
                for(let id in otherPlayers) {
                    ctx.arc(otherPlayers[id].x, otherPlayers[id].y, 140, 0, Math.PI * 2, true);
                }
                ctx.fill();
                ctx.restore();
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
