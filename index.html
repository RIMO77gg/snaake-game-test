<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Mini Games - الإصلاح الشامل</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #020617; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; color: #fff; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        
        /* القائمة الرئيسية */
        .menu-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 25px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; width: 90%; max-width: 450px; z-index: 20; position: absolute; }
        .menu-card h1 { font-size: 2rem; margin-bottom: 12px; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .id-box { background: rgba(30, 41, 59, 0.8); padding: 10px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 15px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .id-text { color: #4ade80; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .btn-copy { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-copy:hover { background: #38bdf8; color: #0f172a; }
        
        .color-picker-title { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px; text-align: right; font-weight: bold; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 15px; }
        .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.8); }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #334155; color: white; margin-top: 5px; }
        .btn-secondary:hover { background: #475569; }
        
        /* الكانفاس برؤية ثابتة ومحاطة بالحجم الاصلي */
        #canvas { display: none; background: #0f172a; box-shadow: 0 0 40px rgba(0,0,0,0.8); border: 3px solid #38bdf8; position: absolute; }
        
        /* HUD واجهة المعومات والحالة والأزرار */
        #hud { display: none; position: absolute; top: 15px; width: 90%; max-width: 1200px; justify-content: space-between; align-items: center; z-index: 10; }
        .hud-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .nav-btn:hover { background: #ef4444; border-color: #ef4444; }
        .nav-btn.lobby { background: #0284c7; border-color: #38bdf8; }
        .nav-btn.lobby:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="hud">
            <div class="hud-card">
                <div>اللاعبون: <span id="player-count" style="color: #4ade80; font-weight: bold;">1</span></div>
                <div>|</div>
                <div>المنطقة: <span id="current-game-title" style="color: #38bdf8; font-weight: bold;">اللوبي الرئيسي</span></div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="nav-btn lobby" onclick="returnToLobby()">العودة للوبي 🏠</button>
                <button class="nav-btn" onclick="returnToMainMenu()">القائمة الرئيسية 🚪</button>
            </div>
        </div>

        <div class="menu-card" id="main-menu">
            <h1>عالم Mini Games 🎮</h1>
            
            <div class="id-box">
                <div>كود الغرفة: <span class="id-text" id="my-id">جاري الإنشاء...</span></div>
                <button class="btn-copy" id="copy-btn" onclick="copyMyID()">نسخ 📋</button>
            </div>

            <div class="color-picker-title">اختر لون لاعبك:</div>
            <div class="color-grid" id="color-grid"></div>

            <div class="input-group">
                <input type="text" id="peer-id-input" placeholder="أدخل كود غرفة صديقك">
                <button class="btn btn-primary" id="join-btn">انضمام للعب 🔗</button>
            </div>

            <button class="btn btn-secondary" onclick="startHosting()">دخول اللوبي الفوري 🎮</button>
        </div>

        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');
        const playerCountDisplay = document.getElementById('player-count');
        const currentGameTitle = document.getElementById('current-game-title');
        const myIdDisplay = document.getElementById('my-id');
        const copyBtn = document.getElementById('copy-btn');
        const joinBtn = document.getElementById('join-btn');

        // الأبعاد الثابتة الافتراضية
        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;

        const colors = [
            '#38bdf8', '#ef4444', '#22c55e', '#eab308', '#a855f7',
            '#ec4899', '#f97316', '#14b8a6', '#f43f5e', '#8b5cf6'
        ];
        
        let currentGameMode = 'lobby'; 
        let myPlayer = { id: 'LOCAL', x: 640, y: 550, size: 30, speed: 7, color: colors[0] };

        // منصات وبوابات اللوبي المضيئة والمحددة
        const portals = [
            { id: 'puzzle', title: '🧩 لغز الباب التعاوني', x: 300, y: 350, radius: 85, color: '#38bdf8' },
            { id: 'dodge', title: '🤾‍♂️ تفادي الصخور الساقطة', x: 640, y: 350, radius: 85, color: '#f97316' },
            { id: 'horror', title: '👻 المتاهة المظلمة (رعب)', x: 980, y: 350, radius: 85, color: '#a855f7' }
        ];

        let startTimer = null;
        let countdown = 0;
        let activePortalTarget = null;

        // إعداد الألوان
        const colorGrid = document.getElementById('color-grid');
        colors.forEach((col, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                myPlayer.color = col;
            };
            colorGrid.appendChild(btn);
        });

        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        let peer = null;
        let connections = {};
        let otherPlayers = {};

        // محاكاة عناصر اللعب
        let puzzleButton = { x: 300, y: 360, radius: 45 };
        let puzzleDoor = { x: 880, y: 150, width: 35, height: 420, open: false };
        let fallingRocks = [];
        let horrorMonster = { x: 200, y: 200, size: 45, speed: 2.8 };

        function initPeer() {
            peer = new Peer('ROOM-' + roomCode);
            peer.on('open', (id) => { myPlayer.id = id; myIdDisplay.innerText = roomCode; });
            peer.on('connection', (conn) => setupConnection(conn));
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer();
                    peer.on('open', (id) => { myPlayer.id = id; myIdDisplay.innerText = id; });
                    peer.on('connection', (conn) => setupConnection(conn));
                }
            });
        }
        initPeer();

        function setupConnection(conn) {
            connections[conn.peer] = conn;
            conn.on('open', () => {
                updatePlayerCount();
                conn.send({ type: 'update', id: myPlayer.id, x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, mode: currentGameMode });
            });
            conn.on('data', (data) => {
                if (data.type === 'update') {
                    if (!otherPlayers[data.id]) {
                        otherPlayers[data.id] = { x: data.x, y: data.y, targetX: data.x, targetY: data.y, color: data.color, size: 30 };
                    } else {
                        otherPlayers[data.id].targetX = data.x;
                        otherPlayers[data.id].targetY = data.y;
                        otherPlayers[data.id].color = data.color;
                    }
                    if(data.mode && data.mode !== currentGameMode) {
                        setGameMode(data.mode);
                    }
                    updatePlayerCount();
                }
            });
            conn.on('close', () => {
                delete connections[conn.peer];
                delete otherPlayers[conn.peer];
                updatePlayerCount();
            });
        }

        function updatePlayerCount() {
            playerCountDisplay.innerText = Object.keys(otherPlayers).length + 1;
        }

        function copyMyID() {
            navigator.clipboard.writeText(myIdDisplay.innerText).then(() => {
                copyBtn.innerText = "تم النسخ! ✅";
                copyBtn.style.background = "#22c55e";
                setTimeout(() => { copyBtn.innerText = "نسخ 📋"; copyBtn.style.background = "#334155"; }, 2000);
            });
        }

        function startHosting() { startGame(); }

        joinBtn.addEventListener('click', function() {
            const inputField = document.getElementById('peer-id-input');
            let targetRoom = inputField.value.trim();
            if (targetRoom !== "") {
                if(!targetRoom.startsWith('ROOM-') && targetRoom.length === 4) targetRoom = 'ROOM-' + targetRoom;
                const conn = peer.connect(targetRoom);
                setupConnection(conn);
                startGame();
            } else { alert("يرجى إدخال كود الغرفة أولاً!"); }
        });

        function returnToLobby() {
            setGameMode('lobby');
            broadcastPosition();
        }

        function returnToMainMenu() {
            hud.style.display = 'none';
            canvas.style.display = 'none';
            mainMenu.style.display = 'block';
        }

        function setGameMode(mode) {
            currentGameMode = mode;
            const titles = {
                'lobby': 'اللوبي الرئيسي',
                'puzzle': '🧩 لغز الباب التعاوني',
                'dodge': '🤾‍♂️ تفادي الصخور',
                'horror': '👻 المتاهة المظلمة'
            };
            currentGameTitle.innerText = titles[mode];
            myPlayer.x = 640; myPlayer.y = 550;
            if(mode === 'dodge') fallingRocks = [];
        }

        function startGame() {
            mainMenu.style.display = 'none';
            hud.style.display = 'flex';
            canvas.style.display = 'block';
            resizeCanvas();

            setInterval(broadcastPosition, 30);
            setInterval(updateGameLogic, 1000 / 60);
            requestAnimationFrame(gameLoop);
        }

        // تحجيم ذكي يحافظ على نسبة العرض والارتفاع لمنع الاختفاء والتمدد
        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / VIRTUAL_WIDTH, window.innerHeight / VIRTUAL_HEIGHT) * 0.95;
            canvas.style.width = `${VIRTUAL_WIDTH * scale}px`;
            canvas.style.height = `${VIRTUAL_HEIGHT * scale}px`;
        }
        window.addEventListener('resize', resizeCanvas);

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function updateGameLogic() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy -= myPlayer.speed;
            if (keys['s'] || keys['arrowdown']) dy += myPlayer.speed;
            if (keys['a'] || keys['arrowleft']) dx -= myPlayer.speed;
            if (keys['d'] || keys['arrowright']) dx += myPlayer.speed;

            let nextX = myPlayer.x + dx;
            let nextY = myPlayer.y + dy;

            // ** حدود اللوبي والميدان المغلق الصارم **
            const margin = 25;
            if (nextX >= margin && nextX <= VIRTUAL_WIDTH - margin) myPlayer.x = nextX;
            if (nextY >= margin && nextY <= VIRTUAL_HEIGHT - margin) myPlayer.y = nextY;

            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                p.x += (p.targetX - p.x) * 0.4;
                p.y += (p.targetY - p.y) * 0.4;
            }

            // فحص دخول دوائر الألعاب في اللوبي
            if (currentGameMode === 'lobby') {
                let insidePortal = null;
                portals.forEach(portal => {
                    let d = Math.hypot(myPlayer.x - portal.x, myPlayer.y - portal.y);
                    if (d < portal.radius) insidePortal = portal;
                });

                if (insidePortal) {
                    let allPlayersIn = true;
                    for (let id in otherPlayers) {
                        let op = otherPlayers[id];
                        if (Math.hypot(op.x - insidePortal.x, op.y - insidePortal.y) >= insidePortal.radius) {
                            allPlayersIn = false; break;
                        }
                    }

                    if (allPlayersIn) {
                        if (!startTimer) {
                            countdown = 3;
                            activePortalTarget = insidePortal.id;
                            startTimer = setInterval(() => {
                                countdown--;
                                if (countdown <= 0) {
                                    clearInterval(startTimer);
                                    startTimer = null;
                                    setGameMode(activePortalTarget);
                                    broadcastPosition();
                                }
                            }, 1000);
                        }
                    } else {
                        if (startTimer) { clearInterval(startTimer); startTimer = null; }
                    }
                } else {
                    if (startTimer) { clearInterval(startTimer); startTimer = null; }
                }
            }
            else if (currentGameMode === 'puzzle') {
                let distToBtn = Math.hypot(myPlayer.x - puzzleButton.x, myPlayer.y - puzzleButton.y);
                let otherOnBtn = false;
                for(let id in otherPlayers) {
                    if(Math.hypot(otherPlayers[id].x - puzzleButton.x, otherPlayers[id].y - puzzleButton.y) < puzzleButton.radius) otherOnBtn = true;
                }
                puzzleDoor.open = (distToBtn < puzzleButton.radius || otherOnBtn);

                if (!puzzleDoor.open) {
                    if (myPlayer.x + myPlayer.size/2 > puzzleDoor.x && myPlayer.x - myPlayer.size/2 < puzzleDoor.x + puzzleDoor.width &&
                        myPlayer.y + myPlayer.size/2 > puzzleDoor.y && myPlayer.y - myPlayer.size/2 < puzzleDoor.y + puzzleDoor.height) {
                        myPlayer.x -= dx; myPlayer.y -= dy;
                    }
                }
            } 
            else if (currentGameMode === 'dodge') {
                if (Math.random() < 0.08) {
                    fallingRocks.push({ x: Math.random() * (VIRTUAL_WIDTH - 60) + 30, y: -20, radius: Math.random() * 20 + 15, speed: Math.random() * 4 + 4 });
                }
                for (let i = fallingRocks.length - 1; i >= 0; i--) {
                    let r = fallingRocks[i]; r.y += r.speed;
                    if (Math.hypot(myPlayer.x - r.x, myPlayer.y - r.y) < r.radius + myPlayer.size/2) {
                        myPlayer.x = 640; myPlayer.y = 550;
                    }
                    if (r.y > VIRTUAL_HEIGHT + 30) fallingRocks.splice(i, 1);
                }
            } 
            else if (currentGameMode === 'horror') {
                let target = myPlayer;
                let minDist = Math.hypot(myPlayer.x - horrorMonster.x, myPlayer.y - horrorMonster.y);
                for(let id in otherPlayers) {
                    let d = Math.hypot(otherPlayers[id].x - horrorMonster.x, otherPlayers[id].y - horrorMonster.y);
                    if(d < minDist) { minDist = d; target = otherPlayers[id]; }
                }

                let angle = Math.atan2(target.y - horrorMonster.y, target.x - horrorMonster.x);
                horrorMonster.x += Math.cos(angle) * horrorMonster.speed;
                horrorMonster.y += Math.sin(angle) * horrorMonster.speed;

                if(Math.hypot(myPlayer.x - horrorMonster.x, myPlayer.y - horrorMonster.y) < horrorMonster.size/2 + myPlayer.size/2) {
                    myPlayer.x = 1100; myPlayer.y = 600;
                }
            }
        }

        function broadcastPosition() {
            const packet = { type: 'update', id: myPlayer.id, x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, mode: currentGameMode };
            for (let peerId in connections) {
                if (connections[peerId].open) connections[peerId].send(packet);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            // جدران الحدود المغلقة للوبي والملعب
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, VIRTUAL_WIDTH - 10, VIRTUAL_HEIGHT - 10);

            // شبكة الخلفية
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < VIRTUAL_WIDTH; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIRTUAL_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y < VIRTUAL_HEIGHT; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIRTUAL_WIDTH, y); ctx.stroke();
            }

            // رسم دوائر اللوبي للألعاب
            if (currentGameMode === 'lobby') {
                portals.forEach(portal => {
                    ctx.fillStyle = portal.color + '22';
                    ctx.strokeStyle = portal.color;
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 18px Tahoma';
                    ctx.textAlign = 'center';
                    ctx.fillText(portal.title, portal.x, portal.y - portal.radius - 15);
                    ctx.font = '13px Tahoma';
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillText('قف هنا لبدء اللعبة مع صديقك', portal.x, portal.y + 5);
                });

                if (startTimer) {
                    ctx.fillStyle = '#4ade80';
                    ctx.font = 'bold 36px Tahoma';
                    ctx.textAlign = 'center';
                    ctx.fillText(`الانطلاق بعد: ${countdown}`, VIRTUAL_WIDTH / 2, 120);
                }
            }
            else if (currentGameMode === 'puzzle') {
                ctx.fillStyle = puzzleDoor.open ? '#22c55e' : '#ef4444';
                ctx.beginPath(); ctx.arc(puzzleButton.x, puzzleButton.y, puzzleButton.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Tahoma'; ctx.textAlign = 'center';
                ctx.fillText('زر الباب', puzzleButton.x, puzzleButton.y + 5);

                ctx.fillStyle = puzzleDoor.open ? 'rgba(34, 197, 94, 0.2)' : '#eab308';
                ctx.fillRect(puzzleDoor.x, puzzleDoor.y, puzzleDoor.width, puzzleDoor.height);
            }
            else if (currentGameMode === 'dodge') {
                ctx.fillStyle = '#f97316';
                fallingRocks.forEach(r => { ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.fill(); });
            }
            else if (currentGameMode === 'horror') {
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 25; ctx.shadowColor = '#ef4444';
                ctx.fillRect(horrorMonster.x - horrorMonster.size/2, horrorMonster.y - horrorMonster.size/2, horrorMonster.size, horrorMonster.size);
                ctx.shadowBlur = 0;
            }

            // رسم اللاعبين الآخرين
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12; ctx.shadowColor = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }

            // رسم المربع الخاص بك
            ctx.fillStyle = myPlayer.color;
            ctx.shadowBlur = 15; ctx.shadowColor = myPlayer.color;
            ctx.fillRect(myPlayer.x - myPlayer.size/2, myPlayer.y - myPlayer.size/2, myPlayer.size, myPlayer.size);
            ctx.shadowBlur = 0;

            // إضاءة كشاف الرعب
            if (currentGameMode === 'horror') {
                ctx.save();
                ctx.fillStyle = 'rgba(3, 7, 18, 0.96)';
                ctx.beginPath();
                ctx.rect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                ctx.arc(myPlayer.x, myPlayer.y, 150, 0, Math.PI * 2, true);
                for(let id in otherPlayers) {
                    ctx.arc(otherPlayers[id].x, otherPlayers[id].y, 150, 0, Math.PI * 2, true);
                }
                ctx.fill();
                ctx.restore();
            }
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
