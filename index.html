<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الألغاز 2D أونلاين</title>
    <!-- مكتبة PeerJS للاتصال المباشر السريع جداً WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .menu-card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 95%; max-width: 480px; z-index: 10; }
        .menu-card h1 { font-size: 2rem; margin-bottom: 15px; color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .id-box { background: rgba(15, 23, 42, 0.7); padding: 12px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 15px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .id-text { color: #4ade80; font-weight: bold; font-family: monospace; font-size: 1.1rem; }
        .btn-copy { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .btn-copy:hover { background: #38bdf8; color: #0f172a; }
        
        /* اختيار الألوان */
        .color-picker-title { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 10px; text-align: right; font-weight: bold; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 12px rgba(255,255,255,0.8); }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #334155; color: white; margin-top: 8px; }
        .btn-secondary:hover { background: #475569; }
        
        #canvas { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #hud { display: none; position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.85); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); z-index: 5; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            اللاعبون المتصلون: <span id="player-count" style="color: #4ade80;">1</span>
        </div>

        <div class="menu-card" id="main-menu">
            <h1>ألغاز 2D أونلاين</h1>
            
            <div class="id-box">
                <div>كود غرفتك: <span class="id-text" id="my-id">جاري الإنشاء...</span></div>
                <button class="btn-copy" id="copy-btn" onclick="copyMyID()">نسخ 📋</button>
            </div>

            <div class="color-picker-title">اختر لون لاعبك:</div>
            <div class="color-grid" id="color-grid"></div>

            <div class="input-group">
                <input type="text" id="peer-id-input" placeholder="أدخل كود غرفة صديقك">
                <button class="btn btn-primary" id="join-btn">انضمام للغرفة واللعب 🔗</button>
            </div>

            <button class="btn btn-secondary" onclick="startHosting()">استضافة واللعب في غرفتك 🎮</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');
        const playerCountDisplay = document.getElementById('player-count');
        const myIdDisplay = document.getElementById('my-id');
        const copyBtn = document.getElementById('copy-btn');
        const joinBtn = document.getElementById('join-btn');

        // قائمة الـ 10 ألوان
        const colors = [
            '#38bdf8', '#ef4444', '#22c55e', '#eab308', '#a855f7',
            '#ec4899', '#f97316', '#14b8a6', '#f43f5e', '#8b5cf6'
        ];
        
        let myPlayer = { 
            id: null,
            x: 200, 
            y: 200, 
            size: 30, 
            speed: 6, 
            color: colors[0] // اللون الافتراضي الأول
        };

        // إنشاء شبكة الألوان الخمسة × اثنان
        const colorGrid = document.getElementById('color-grid');
        colors.forEach((col, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                myPlayer.color = col; // ربط اللون المختار بالمربع الخاص بك مباشرة
            };
            colorGrid.appendChild(btn);
        });

        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        let peer = null;
        let connections = {};
        let otherPlayers = {};

        function initPeer() {
            peer = new Peer('ROOM-' + roomCode);

            peer.on('open', (id) => {
                myPlayer.id = id;
                myIdDisplay.innerText = roomCode;
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer();
                    peer.on('open', (id) => {
                        myPlayer.id = id;
                        myIdDisplay.innerText = id;
                    });
                    peer.on('connection', (conn) => setupConnection(conn));
                }
            });
        }

        initPeer();

        function setupConnection(conn) {
            connections[conn.peer] = conn;

            conn.on('open', () => {
                updatePlayerCount();
                // إرسال البيانات المحدثة (شاملة اللون المحدد) للداخل الجديد
                conn.send({
                    type: 'update',
                    id: myPlayer.id,
                    x: myPlayer.x,
                    y: myPlayer.y,
                    color: myPlayer.color
                });
            });

            conn.on('data', (data) => {
                if (data.type === 'update') {
                    if (!otherPlayers[data.id]) {
                        otherPlayers[data.id] = { x: data.x, y: data.y, targetX: data.x, targetY: data.y, color: data.color, size: 30 };
                    } else {
                        otherPlayers[data.id].targetX = data.x;
                        otherPlayers[data.id].targetY = data.y;
                        otherPlayers[data.id].color = data.color; // تحديث اللون الخاص بالطرف الآخر
                    }
                    updatePlayerCount();
                }
            });

            conn.on('close', () => {
                delete connections[conn.peer];
                delete otherPlayers[conn.peer];
                updatePlayerCount();
            });
        }

        function updatePlayerCount() {
            playerCountDisplay.innerText = Object.keys(otherPlayers).length + 1;
        }

        function copyMyID() {
            navigator.clipboard.writeText(myIdDisplay.innerText).then(() => {
                copyBtn.innerText = "تم النسخ! ✅";
                copyBtn.style.background = "#22c55e";
                setTimeout(() => {
                    copyBtn.innerText = "نسخ 📋";
                    copyBtn.style.background = "#334155";
                }, 2000);
            });
        }

        function startHosting() {
            startGame();
        }

        joinBtn.addEventListener('click', function() {
            const inputField = document.getElementById('peer-id-input');
            let targetRoom = inputField.value.trim();
            
            if (targetRoom !== "") {
                if(!targetRoom.startsWith('ROOM-') && targetRoom.length === 4) {
                    targetRoom = 'ROOM-' + targetRoom;
                }
                const conn = peer.connect(targetRoom);
                setupConnection(conn);
                startGame();
            } else {
                alert("يرجى إدخال كود الغرفة أولاً!");
            }
        });

        function startGame() {
            mainMenu.style.display = 'none';
            hud.style.display = 'block';
            canvas.style.display = 'block';
            resizeCanvas();
            
            myPlayer.x = Math.floor(Math.random() * (canvas.width - 200)) + 100;
            myPlayer.y = Math.floor(Math.random() * (canvas.height - 200)) + 100;

            setInterval(broadcastPosition, 30);
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            if (keys['w'] || keys['arrowup']) myPlayer.y -= myPlayer.speed;
            if (keys['s'] || keys['arrowdown']) myPlayer.y += myPlayer.speed;
            if (keys['a'] || keys['arrowleft']) myPlayer.x -= myPlayer.speed;
            if (keys['d'] || keys['arrowright']) myPlayer.x += myPlayer.speed;

            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                p.x += (p.targetX - p.x) * 0.4;
                p.y += (p.targetY - p.y) * 0.4;
            }
        }

        function broadcastPosition() {
            const packet = {
                type: 'update',
                id: myPlayer.id,
                x: myPlayer.x,
                y: myPlayer.y,
                color: myPlayer.color // إرسال اللون مع إحداثيات الحركة باستمرار
            };
            for (let peerId in connections) {
                if (connections[peerId].open) {
                    connections[peerId].send(packet);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // شبكة الخلفية
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // رسم بقية اللاعبين باللون الذي اختاروه هم
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }

            // رسم اللاعب الخاص بك باللون الذي اخترته أنت
            ctx.fillStyle = myPlayer.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = myPlayer.color;
            ctx.fillRect(myPlayer.x - myPlayer.size/2, myPlayer.y - myPlayer.size/2, myPlayer.size, myPlayer.size);

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
