<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب Mini Games المحدثة بالكامل</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #030712; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; color: #fff; }
        
        #game-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        
        .menu-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 2px solid rgba(56, 189, 248, 0.3); padding: 30px; border-radius: 24px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.2); text-align: center; width: 90%; max-width: 480px; z-index: 20; position: absolute; }
        .menu-card h1 { font-size: 2.2rem; margin-bottom: 12px; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
        .id-box { background: rgba(30, 41, 59, 0.8); padding: 12px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 15px; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }
        .id-text { color: #4ade80; font-weight: bold; font-family: monospace; font-size: 1.2rem; }
        .btn-copy { background: #334155; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-copy:hover { background: #38bdf8; color: #0f172a; }
        
        .color-picker-title { font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px; text-align: right; font-weight: bold; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 15px rgba(255,255,255,0.9); }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4); }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-secondary { background: #334155; color: white; margin-top: 5px; }
        .btn-secondary:hover { background: #475569; }
        
        #canvas { display: none; background: #090d16; box-shadow: 0 0 50px rgba(0,0,0,0.9); border: 2px solid rgba(56, 189, 248, 0.4); position: absolute; }
        
        #hud { display: none; position: absolute; top: 20px; width: 90%; max-width: 1200px; justify-content: space-between; align-items: center; z-index: 10; }
        .hud-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 10px 22px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.95rem; display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background: #ef4444; border-color: #ef4444; }
        .nav-btn.lobby { background: #0284c7; border-color: #38bdf8; }
        .nav-btn.lobby:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="hud">
            <div class="hud-card">
                <div>اللاعبون: <span id="player-count" style="color: #4ade80; font-weight: bold;">1</span></div>
                <div>|</div>
                <div>المنطقة: <span id="current-game-title" style="color: #38bdf8; font-weight: bold;">اللوبي الرئيسي</span></div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="nav-btn lobby" onclick="returnToLobby()">العودة للوبي 🏠</button>
                <button class="nav-btn" onclick="returnToMainMenu()">القائمة الرئيسية 🚪</button>
            </div>
        </div>

        <div class="menu-card" id="main-menu">
            <h1>عالم Mini Games 🎮</h1>
            
            <div class="id-box">
                <div>كود الغرفة: <span class="id-text" id="my-id">جاري الإنشاء...</span></div>
                <button class="btn-copy" id="copy-btn" onclick="copyMyID()">نسخ 📋</button>
            </div>

            <div class="color-picker-title">اختر لون لاعبك:</div>
            <div class="color-grid" id="color-grid"></div>

            <div class="input-group">
                <input type="text" id="peer-id-input" placeholder="أدخل كود غرفة صديقك">
                <button class="btn btn-primary" id="join-btn">انضمام للعب 🔗</button>
            </div>

            <button class="btn btn-secondary" onclick="startHosting()">دخول اللوبي الفوري 🎮</button>
        </div>

        <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        // --- محرك الصوت الذكي ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.15, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');
        const playerCountDisplay = document.getElementById('player-count');
        const currentGameTitle = document.getElementById('current-game-title');
        const myIdDisplay = document.getElementById('my-id');
        const copyBtn = document.getElementById('copy-btn');
        const joinBtn = document.getElementById('join-btn');

        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;

        const colors = ['#38bdf8', '#ef4444', '#22c55e', '#eab308', '#a855f7', '#ec4899', '#f97316', '#14b8a6', '#f43f5e', '#8b5cf6'];
        let currentGameMode = 'lobby'; 
        
        let myPlayer = { id: 'LOCAL', x: 640, y: 550, vx: 0, vy: 0, size: 30, speed: 1.4, friction: 0.85, color: colors[0] };
        let particles = [];

        // المنصات الأساسية باللوبي
        const portals = [
            { id: 'simon_real', title: '🎯 سايمون يقول (Simon Says)', x: 180, y: 350, radius: 70, color: '#f97316' },
            { id: 'color_memory', title: '🧠 ذاكرة الألوان (Memory)', x: 410, y: 350, radius: 70, color: '#eab308' },
            { id: 'soccer', title: '⚽ كرة القدم (Soccer)', x: 640, y: 350, radius: 70, color: '#22c55e' },
            { id: 'lava', title: '🔥 أرضية الحمم (Lava)', x: 870, y: 350, radius: 70, color: '#ef4444' },
            { id: 'horror', title: '👻 المتاهة المظلمة (Horror)', x: 1100, y: 350, radius: 70, color: '#a855f7' }
        ];

        let startTimer = null, countdown = 0, activePortalTarget = null;

        // إعداد شبكة الألوان
        const colorGrid = document.getElementById('color-grid');
        colors.forEach((col, index) => {
            const btn = document.createElement('button');
            btn.className = `color-btn ${index === 0 ? 'selected' : ''}`;
            btn.style.backgroundColor = col;
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                myPlayer.color = col;
                playSound(600, 'sine', 0.1, 0.1);
            };
            colorGrid.appendChild(btn);
        });

        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        let peer = null, connections = {}, otherPlayers = {};

        // --- 1. بيانات لعبة: سايمون يقول الأصلية ---
        const simonPalette = [
            { name: 'الأحمر', hex: '#ef4444' }, { name: 'الأزرق', hex: '#38bdf8' },
            { name: 'الأخضر', hex: '#22c55e' }, { name: 'الأصفر', hex: '#eab308' },
            { name: 'الوردي', hex: '#ec4899' }, { name: 'البنفسجي', hex: '#a855f7' },
            { name: 'البرتقالي', hex: '#f97316' }, { name: 'الفيروزي', hex: '#14b8a6' }
        ];
        let simonGrid = [];
        let simonTargetColor = null;
        let simonTimer = 0;
        let simonPhase = 'WAITING'; // WAITING, RUN, DROP

        // --- 2. بيانات لعبة: ذاكرة الألوان ---
        const memoryBlocks = [
            { id: 0, color: '#ef4444', freq: 261, x: 440, y: 200, w: 180, h: 140 },
            { id: 1, color: '#38bdf8', freq: 329, x: 660, y: 200, w: 180, h: 140 },
            { id: 2, color: '#22c55e', freq: 392, x: 440, y: 380, w: 180, h: 140 },
            { id: 3, color: '#eab308', freq: 523, x: 660, y: 380, w: 180, h: 140 }
        ];
        let memorySequence = [], memoryStep = 0, memoryActiveIndex = -1, memoryState = 'WAITING';

        // --- 3. بيانات لعبة: كرة القدم المتقدمة ---
        let ball = { x: 640, y: 360, vx: 0, vy: 0, radius: 18, friction: 0.98, bounce: 0.7 };
        let soccerScore = { team1: 0, team2: 0 };

        // --- 4. بيانات لعبة: المتاهة المظلمة (Horror) ---
        let mazeWalls = [
            { x: 200, y: 100, w: 20, h: 400 },
            { x: 200, y: 500, w: 300, h: 20 },
            { x: 400, y: 200, w: 400, h: 20 },
            { x: 600, y: 350, w: 20, h: 250 },
            { x: 750, y: 100, w: 20, h: 400 },
            { x: 900, y: 300, w: 200, h: 20 }
        ];
        let monster = { x: 1100, y: 150, size: 36, speed: 2.2 };

        function initPeer() {
            peer = new Peer('ROOM-' + roomCode);
            peer.on('open', (id) => { myPlayer.id = id; myIdDisplay.innerText = roomCode; });
            peer.on('connection', (conn) => setupConnection(conn));
        }
        initPeer();

        function setupConnection(conn) {
            connections[conn.peer] = conn;
            conn.on('open', () => {
                updatePlayerCount();
                conn.send({ type: 'update', id: myPlayer.id, x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, mode: currentGameMode, ball: ball });
            });
            conn.on('data', (data) => {
                if (data.type === 'update') {
                    if (!otherPlayers[data.id]) {
                        otherPlayers[data.id] = { x: data.x, y: data.y, targetX: data.x, targetY: data.y, color: data.color, size: 30 };
                    } else {
                        otherPlayers[data.id].targetX = data.x;
                        otherPlayers[data.id].targetY = data.y;
                        otherPlayers[data.id].color = data.color;
                    }
                    if(data.ball) { ball.x = data.ball.x; ball.y = data.ball.y; }
                    if(data.mode && data.mode !== currentGameMode) setGameMode(data.mode);
                    updatePlayerCount();
                }
            });
            conn.on('close', () => { delete connections[conn.peer]; delete otherPlayers[conn.peer]; updatePlayerCount(); });
        }

        function updatePlayerCount() { playerCountDisplay.innerText = Object.keys(otherPlayers).length + 1; }

        function copyMyID() {
            navigator.clipboard.writeText(myIdDisplay.innerText).then(() => {
                copyBtn.innerText = "تم النسخ! ✅";
                copyBtn.style.background = "#22c55e";
                setTimeout(() => { copyBtn.innerText = "نسخ 📋"; copyBtn.style.background = "#334155"; }, 2000);
            });
        }

        function startHosting() { startGame(); }

        joinBtn.addEventListener('click', function() {
            let targetRoom = document.getElementById('peer-id-input').value.trim();
            if (targetRoom !== "") {
                if(!targetRoom.startsWith('ROOM-') && targetRoom.length === 4) targetRoom = 'ROOM-' + targetRoom;
                setupConnection(peer.connect(targetRoom));
                startGame();
            }
        });

        function returnToLobby() { setGameMode('lobby'); broadcastPosition(); }
        function returnToMainMenu() { hud.style.display = 'none'; canvas.style.display = 'none'; mainMenu.style.display = 'block'; }

        function setGameMode(mode) {
            currentGameMode = mode;
            const titles = {
                'lobby': 'اللوبي الرئيسي',
                'simon_real': '🎯 سايمون يقول (Simon Says)',
                'color_memory': '🧠 ذاكرة الألوان (Memory)',
                'soccer': '⚽ كرة القدم أونلاين',
                'lava': '🔥 أرضية الحمم الحارقة',
                'horror': '👻 المتاهة المظلمة'
            };
            currentGameTitle.innerText = titles[mode];
            myPlayer.x = 640; myPlayer.y = 550; myPlayer.vx = 0; myPlayer.vy = 0;
            
            if(mode === 'simon_real') initSimonReal();
            if(mode === 'color_memory') initMemoryGame();
            playSound(440, 'triangle', 0.2, 0.15);
        }

        function startGame() {
            mainMenu.style.display = 'none'; hud.style.display = 'flex'; canvas.style.display = 'block';
            resizeCanvas();
            setInterval(broadcastPosition, 30);
            setInterval(updateGameLogic, 1000 / 60);
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / VIRTUAL_WIDTH, window.innerHeight / VIRTUAL_HEIGHT) * 0.95;
            canvas.style.width = `${VIRTUAL_WIDTH * scale}px`;
            canvas.style.height = `${VIRTUAL_HEIGHT * scale}px`;
        }
        window.addEventListener('resize', resizeCanvas);

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function createParticles(x, y, color, count = 8) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 5 + 2, color: color, life: 1
                });
            }
        }

        // --- 1. منطق سايمون يقول الأصلية ---
        function initSimonReal() {
            simonGrid = [];
            for(let r=0; r<3; r++) {
                for(let c=0; c<4; c++) {
                    let col = simonPalette[Math.floor(Math.random() * simonPalette.length)];
                    simonGrid.push({ x: 220 + c*220, y: 160 + r*160, w: 200, h: 140, color: col });
                }
            }
            startSimonRound();
        }

        function startSimonRound() {
            simonPhase = 'RUN';
            simonTimer = 4;
            simonTargetColor = simonPalette[Math.floor(Math.random() * simonPalette.length)];
            
            let simonInterval = setInterval(() => {
                simonTimer--;
                playSound(500 + (4 - simonTimer)*80, 'sine', 0.1, 0.1);
                if(simonTimer <= 0) {
                    clearInterval(simonInterval);
                    simonPhase = 'DROP';
                    playSound(200, 'sawtooth', 0.3, 0.25);
                    
                    setTimeout(() => {
                        let standingOnSafeTile = false;
                        simonGrid.forEach(tile => {
                            if(tile.color.hex === simonTargetColor.hex) {
                                if(myPlayer.x > tile.x && myPlayer.x < tile.x + tile.w && myPlayer.y > tile.y && myPlayer.y < tile.y + tile.h) {
                                    standingOnSafeTile = true;
                                }
                            }
                        });

                        if(!standingOnSafeTile) {
                            playSound(120, 'sawtooth', 0.4, 0.3);
                            createParticles(myPlayer.x, myPlayer.y, '#ef4444', 25);
                            myPlayer.x = 640; myPlayer.y = 550; // سقوط
                        } else {
                            playSound(880, 'sine', 0.2, 0.2);
                            createParticles(myPlayer.x, myPlayer.y, '#22c55e', 15);
                        }
                        setTimeout(() => initSimonReal(), 1500);
                    }, 1200);
                }
            }, 1000);
        }

        // --- 2. منطق ذاكرة الألوان ---
        function initMemoryGame() {
            memorySequence = [Math.floor(Math.random()*4), Math.floor(Math.random()*4)];
            startMemorySequence();
        }

        function startMemorySequence() {
            memoryState = 'SHOWING';
            let index = 0;
            let interval = setInterval(() => {
                memoryActiveIndex = memorySequence[index];
                playSound(memoryBlocks[memoryActiveIndex].freq, 'sine', 0.3, 0.2);
                createParticles(memoryBlocks[memoryActiveIndex].x + 90, memoryBlocks[memoryActiveIndex].y + 70, memoryBlocks[memoryActiveIndex].color, 12);
                
                setTimeout(() => memoryActiveIndex = -1, 400);
                index++;
                
                if(index >= memorySequence.length) {
                    clearInterval(interval);
                    setTimeout(() => { memoryState = 'PLAYING'; memoryStep = 0; }, 500);
                }
            }, 750);
        }

        // --- تحديث الفيزياء والتحكم ---
        function updateGameLogic() {
            let oldX = myPlayer.x, oldY = myPlayer.y;

            if (keys['w'] || keys['arrowup']) myPlayer.vy -= myPlayer.speed;
            if (keys['s'] || keys['arrowdown']) myPlayer.vy += myPlayer.speed;
            if (keys['a'] || keys['arrowleft']) myPlayer.vx -= myPlayer.speed;
            if (keys['d'] || keys['arrowright']) myPlayer.vx += myPlayer.speed;

            myPlayer.vx *= myPlayer.friction;
            myPlayer.vy *= myPlayer.friction;

            myPlayer.x += myPlayer.vx;
            myPlayer.y += myPlayer.vy;

            // تصادم المتاهة في لعبة الرعب
            if(currentGameMode === 'horror') {
                mazeWalls.forEach(wall => {
                    if (myPlayer.x + myPlayer.size/2 > wall.x && myPlayer.x - myPlayer.size/2 < wall.x + wall.w &&
                        myPlayer.y + myPlayer.size/2 > wall.y && myPlayer.y - myPlayer.size/2 < wall.y + wall.h) {
                        myPlayer.x = oldX; myPlayer.y = oldY;
                    }
                });
            }

            const margin = 20;
            if (myPlayer.x < margin) { myPlayer.x = margin; myPlayer.vx = 0; }
            if (myPlayer.x > VIRTUAL_WIDTH - margin) { myPlayer.x = VIRTUAL_WIDTH - margin; myPlayer.vx = 0; }
            if (myPlayer.y < margin) { myPlayer.y = margin; myPlayer.vy = 0; }
            if (myPlayer.y > VIRTUAL_HEIGHT - margin) { myPlayer.y = VIRTUAL_HEIGHT - margin; myPlayer.vy = 0; }

            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                p.x += (p.targetX - p.x) * 0.3;
                p.y += (p.targetY - p.y) * 0.3;
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03;
                if(pt.life <= 0) particles.splice(i, 1);
            }

            // 1. اللوبي
            if (currentGameMode === 'lobby') {
                portals.forEach(portal => {
                    if (Math.hypot(myPlayer.x - portal.x, myPlayer.y - portal.y) < portal.radius) {
                        let allIn = true;
                        for (let id in otherPlayers) {
                            if (Math.hypot(otherPlayers[id].x - portal.x, otherPlayers[id].y - portal.y) >= portal.radius) allIn = false;
                        }
                        if (allIn && !startTimer) {
                            countdown = 3; activePortalTarget = portal.id;
                            startTimer = setInterval(() => {
                                countdown--;
                                playSound(800, 'sine', 0.1, 0.1);
                                if (countdown <= 0) {
                                    clearInterval(startTimer); startTimer = null;
                                    setGameMode(activePortalTarget); broadcastPosition();
                                }
                            }, 1000);
                        }
                    }
                });
            }
            // 2. ذاكرة الألوان
            else if (currentGameMode === 'color_memory' && memoryState === 'PLAYING') {
                memoryBlocks.forEach(b => {
                    if(myPlayer.x > b.x && myPlayer.x < b.x + b.w && myPlayer.y > b.y && myPlayer.y < b.y + b.h) {
                        if(b.id === memorySequence[memoryStep]) {
                            playSound(b.freq, 'sine', 0.2, 0.15);
                            createParticles(myPlayer.x, myPlayer.y, b.color, 10);
                            memoryStep++;
                            if(memoryStep >= memorySequence.length) {
                                playSound(1000, 'square', 0.4, 0.2);
                                memorySequence.push(Math.floor(Math.random()*4));
                                startMemorySequence();
                            }
                        }
                    }
                });
            }
            // 3. كرة القدم المتقدمة
            else if (currentGameMode === 'soccer') {
                let dist = Math.hypot(myPlayer.x - ball.x, myPlayer.y - ball.y);
                if(dist < myPlayer.size/2 + ball.radius) {
                    let angle = Math.atan2(ball.y - myPlayer.y, ball.x - myPlayer.x);
                    let speed = Math.hypot(myPlayer.vx, myPlayer.vy) + 5;
                    ball.vx = Math.cos(angle) * speed;
                    ball.vy = Math.sin(angle) * speed;
                    playSound(300, 'square', 0.1, 0.1);
                }

                ball.x += ball.vx; ball.y += ball.vy;
                ball.vx *= ball.friction; ball.vy *= ball.friction;

                if(ball.x < 60 || ball.x > VIRTUAL_WIDTH - 60) ball.vx *= -ball.bounce;
                if(ball.y < 60 || ball.y > VIRTUAL_HEIGHT - 60) ball.vy *= -ball.bounce;

                // أهداف المرمى
                if(ball.x < 70 && ball.y > 270 && ball.y < 450) {
                    soccerScore.team2++; ball.x = 640; ball.y = 360; ball.vx = 0; ball.vy = 0;
                    playSound(900, 'sine', 0.4, 0.3); createParticles(640, 360, '#22c55e', 40);
                }
                if(ball.x > VIRTUAL_WIDTH - 70 && ball.y > 270 && ball.y < 450) {
                    soccerScore.team1++; ball.x = 640; ball.y = 360; ball.vx = 0; ball.vy = 0;
                    playSound(900, 'sine', 0.4, 0.3); createParticles(640, 360, '#38bdf8', 40);
                }
            }
            // 4. الرعب والمتاهة
            else if (currentGameMode === 'horror') {
                let angle = Math.atan2(myPlayer.y - monster.y, myPlayer.x - monster.x);
                monster.x += Math.cos(angle) * monster.speed;
                monster.y += Math.sin(angle) * monster.speed;

                if(Math.hypot(myPlayer.x - monster.x, myPlayer.y - monster.y) < 30) {
                    playSound(100, 'sawtooth', 0.5, 0.4);
                    myPlayer.x = 100; myPlayer.y = 650;
                }
            }
        }

        function broadcastPosition() {
            const packet = { type: 'update', id: myPlayer.id, x: myPlayer.x, y: myPlayer.y, color: myPlayer.color, mode: currentGameMode, ball: ball };
            for (let peerId in connections) { if (connections[peerId].open) connections[peerId].send(packet); }
        }

        // --- الرسم والرندر ---
        function draw() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < VIRTUAL_WIDTH; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIRTUAL_HEIGHT); ctx.stroke(); }
            for (let y = 0; y < VIRTUAL_HEIGHT; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIRTUAL_WIDTH, y); ctx.stroke(); }

            particles.forEach(pt => {
                ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // 1. اللوبي
            if (currentGameMode === 'lobby') {
                portals.forEach(portal => {
                    ctx.fillStyle = portal.color + '22'; ctx.strokeStyle = portal.color; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Tahoma'; ctx.textAlign = 'center';
                    ctx.fillText(portal.title, portal.x, portal.y - portal.radius - 12);
                });

                if (startTimer) {
                    ctx.fillStyle = '#4ade80'; ctx.font = 'bold 36px Tahoma'; ctx.textAlign = 'center';
                    ctx.fillText(`الانطلاق بعد: ${countdown}`, VIRTUAL_WIDTH / 2, 120);
                }
            }
            // 2. سايمون يقول الأصلي
            else if (currentGameMode === 'simon_real') {
                simonGrid.forEach(tile => {
                    let isVisible = (simonPhase !== 'DROP') || (tile.color.hex === simonTargetColor.hex);
                    if(isVisible) {
                        ctx.fillStyle = tile.color.hex; ctx.shadowBlur = 10; ctx.shadowColor = tile.color.hex;
                        ctx.fillRect(tile.x, tile.y, tile.w, tile.h); ctx.shadowBlur = 0;
                    } else {
                        ctx.fillStyle = '#080c14'; ctx.fillRect(tile.x, tile.y, tile.w, tile.h);
                    }
                });

                if(simonTargetColor) {
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Tahoma'; ctx.textAlign = 'center';
                    ctx.fillText(`سايمون يقول: اركض للون [ ${simonTargetColor.name} ] !`, VIRTUAL_WIDTH/2, 60);
                    ctx.fillStyle = simonTargetColor.hex;
                    ctx.fillText(`الوقت المتبقي: ${simonTimer} ثوانٍ`, VIRTUAL_WIDTH/2, 100);
                }
            }
            // 3. ذاكرة الألوان
            else if (currentGameMode === 'color_memory') {
                memoryBlocks.forEach(b => {
                    ctx.fillStyle = (memoryActiveIndex === b.id) ? '#ffffff' : b.color;
                    ctx.shadowBlur = (memoryActiveIndex === b.id) ? 35 : 10; ctx.shadowColor = b.color;
                    ctx.fillRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
                });
                ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Tahoma'; ctx.textAlign = 'center';
                ctx.fillText(memoryState === 'SHOWING' ? 'احفظ التسلسل الصوتي والحركي!' : 'كرر التسلسل بالوقوف على الألوان!', VIRTUAL_WIDTH/2, 100);
            }
            // 4. كرة القدم
            else if (currentGameMode === 'soccer') {
                ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4;
                ctx.strokeRect(60, 60, VIRTUAL_WIDTH - 120, VIRTUAL_HEIGHT - 120);
                ctx.beginPath(); ctx.arc(VIRTUAL_WIDTH/2, VIRTUAL_HEIGHT/2, 100, 0, Math.PI*2); ctx.stroke();

                // المرميين الشبكيين
                ctx.fillStyle = 'rgba(56, 189, 248, 0.3)'; ctx.fillRect(20, 270, 40, 180);
                ctx.fillStyle = 'rgba(34, 197, 94, 0.3)'; ctx.fillRect(VIRTUAL_WIDTH - 60, 270, 40, 180);

                // الكرة
                ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffffff';
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

                // النتيجة
                ctx.font = 'bold 36px Tahoma'; ctx.textAlign = 'center';
                ctx.fillStyle = '#38bdf8'; ctx.fillText(soccerScore.team1, VIRTUAL_WIDTH/2 - 60, 110);
                ctx.fillStyle = '#fff'; ctx.fillText(':', VIRTUAL_WIDTH/2, 110);
                ctx.fillStyle = '#22c55e'; ctx.fillText(soccerScore.team2, VIRTUAL_WIDTH/2 + 60, 110);
            }
            // 5. الرعب والمتاهة المظلمة
            else if (currentGameMode === 'horror') {
                ctx.fillStyle = '#334155';
                mazeWalls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

                ctx.fillStyle = '#ef4444'; ctx.shadowBlur = 20; ctx.shadowColor = '#ef4444';
                ctx.beginPath(); ctx.arc(monster.x, monster.y, monster.size/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                // الرؤية الديناميكية
                ctx.save();
                ctx.fillStyle = 'rgba(2, 6, 23, 0.97)';
                ctx.beginPath(); ctx.rect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                ctx.arc(myPlayer.x, myPlayer.y, 170, 0, Math.PI * 2, true);
                for(let id in otherPlayers) { ctx.arc(otherPlayers[id].x, otherPlayers[id].y, 170, 0, Math.PI * 2, true); }
                ctx.fill(); ctx.restore();
            }

            // رسم باقي اللاعبين
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }

            // رسم اللاعب المحلي
            ctx.fillStyle = myPlayer.color; ctx.shadowBlur = 18; ctx.shadowColor = myPlayer.color;
            ctx.fillRect(myPlayer.x - myPlayer.size/2, myPlayer.y - myPlayer.size/2, myPlayer.size, myPlayer.size);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
